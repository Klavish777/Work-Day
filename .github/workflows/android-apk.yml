name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle (pinned version compatible with AGP 8.5)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK (Android SDK is preinstalled on the runner)
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: workday-trader-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Push APK to artifacts branch (direct file delivery)
        run: |
          set -e
          mkdir /tmp/apkbranch && cd /tmp/apkbranch
          git init -q -b apk-artifacts
          git config user.name "workday-ci"
          git config user.email "workday-ci@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk" WorkDay-AI-Trader.apk
          printf 'Work-Day AI Trader - Android client (debug build)\nCommit: %s\nRun: %s\n' "${{ github.sha }}" "${{ github.run_id }}" > BUILD_INFO.txt
          git add .
          git commit -q -m "APK build from run ${{ github.run_id }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q -f origin apk-artifacts

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: Work-Day AI Trader — Android APK
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: "true"
